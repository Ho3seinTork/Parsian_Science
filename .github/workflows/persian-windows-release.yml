name: Persian Science Windows Release

# A fork-owned preview release. Keep the upstream stable/signing workflow intact.
# Push a new persian-preview-YYYY.MM.DD tag on main to build and publish Windows x64.
on:
  push:
    tags:
      - 'persian-preview-*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: persian-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preview tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/persian-preview-* ]] ||
             [[ ! "$GITHUB_REF_NAME" =~ ^persian-preview-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo 'Run this workflow on a persian-preview-YYYY.MM.DD tag (optionally followed by .N).' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Resolve matching backend and installer version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          echo "version=${base}-nightly.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
    with:
      platform_name: windows-x64
      nightly: true
      sign_windows: false
      skip_verify: false

  package-smoke:
    needs: build
    uses: ./.github/workflows/package-smoke.yml
    with:
      platform_name: windows-x64
      require_windows_signing: false

  publish:
    needs: [preflight, build, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      # No source checkout or application execution in the write-enabled publisher.
      - name: Download the tested Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: artifacts
      - name: Validate release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          const installer = `persian-science-${process.env.RELEASE_VERSION}-win-x64-setup.exe`
          const entries = readdirSync('artifacts')
          const executables = entries.filter((name) => name.endsWith('.exe'))
          if (executables.length !== 1 || executables[0] !== installer) {
            throw new Error(`Expected exactly ${installer}; found ${executables.join(', ')}`)
          }
          const files = [installer, `${installer}.blockmap`]
          const sums = files.map((name) => {
            const bytes = readFileSync(`artifacts/${name}`)
            if (!bytes.length) throw new Error(`Empty artifact: ${name}`)
            if (name === installer && bytes.subarray(0, 2).toString() !== 'MZ') {
              throw new Error('Installer does not have a Windows executable header')
            }
            return `${createHash('sha256').update(bytes).digest('hex')}  ${name}`
          })
          writeFileSync('artifacts/SHA256SUMS.txt', `${sums.join('\n')}\n`)
          NODE
      - name: Publish Windows preview with installer assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          installer="artifacts/persian-science-${RELEASE_VERSION}-win-x64-setup.exe"
          cat > RELEASE_NOTES.md <<'NOTES'
          نسخهٔ آزمایشی **Persian Science برای Windows x64**.

          فایل `persian-science-…-win-x64-setup.exe` را از Assets دریافت و اجرا کنید.
          فایل `SHA256SUMS.txt` برای بررسی صحت دانلود ارائه شده است.

          - زبان پیش‌فرض فارسی، رابط راست‌به‌چپ، لوگوی پروژه و فونت آراد.
          - ترجمه‌ها هنوز کامل نیستند؛ این انتشار آزمایشی است.
          - نصب‌کننده امضای دیجیتال ناشر ندارد؛ ویندوز ممکن است هشدار ناشر ناشناس نمایش دهد.
          - نصب اولیهٔ محیط‌های Notebook به اینترنت و سرویس‌های upstream نیاز دارد.

          This Windows x64 preview is unsigned. Build verification, installer lifecycle smoke,
          and packaged Windows AppContainer certification must pass before publication.
          It does not update the stable auto-update feed.
          NOTES
          printf '\nSource commit: `%s`\nApplication version: `%s`\n' "$SOURCE_SHA" "$RELEASE_VERSION" >> RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" \
            "$installer" "${installer}.blockmap" artifacts/SHA256SUMS.txt \
            --verify-tag --target "$SOURCE_SHA" --draft --prerelease \
            --title "Persian Science ${RELEASE_VERSION} — Windows x64" \
            --notes-file RELEASE_NOTES.md
          # A failed upload leaves a draft. Never expose a release with missing installer assets.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
